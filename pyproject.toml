[project]
name = "pcnav"
version = "0.1.0"
description = "Path-conditioned RL local planning for long-range navigation, on a wheeled robot"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "torch>=2.13.0",
    "mujoco>=3.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
pcnav-train = "pcnav.scripts_entry:train"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcnav"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731"]  # lambda assignment is used deliberately for local tensor helpers

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
